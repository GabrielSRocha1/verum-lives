# Uso: docker compose -f deploy/docker-compose.yml up -d  (com .env na raiz do projeto)
services:
  verum-lives:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
    volumes:
      - verum-lives-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
volumes:
  verum-lives-data:
